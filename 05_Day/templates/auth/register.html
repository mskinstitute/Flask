
{% extends "bash.html"%}

{% block title %} Register {% endblock title %} 

{% block content %}

<section class="section-content padding-y">

    <!-- ============================ COMPONENT REGISTER   ================================= -->
        <div class="card mx-auto" style="max-width:520px; margin-top:40px;">
          <article class="card-body">
            <header class="mb-4"><h4 class="card-title">Sign up</h4></header>


            <!-- make sure check this form tag for method and action -->
            <form method="post" action="/register"> 


                
                    <div class="form-row">
                        <div class="col form-group">
                            <label for="first_name">First name</label>
                              <input type="text" id="first_name" name="first_name" class="form-control" placeholder="">
                        </div> <!-- form-group end.// -->
                        <div class="col form-group">
                            <label for="last_name">Last name</label>
                              <input type="text" name="last_name" id="last_name" class="form-control" placeholder="">
                        </div> <!-- form-group end.// -->
                    </div> <!-- form-row end.// -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="">
                        <small class="form-text text-muted">We'll never share your email with anyone else.</small>
                    </div> 
                    <div class="form-group">
                        <label class="custom-control custom-radio custom-control-inline">
                          <input class="custom-control-input" checked="" type="radio" name="gender" value="male">
                          <span class="custom-control-label"> Male </span>
                        </label>
                        <label class="custom-control custom-radio custom-control-inline">
                          <input class="custom-control-input" type="radio" name="gender" value="female">
                          <span class="custom-control-label"> Female </span>
                        </label>
                    </div> 
                    
                    <div class="form-row">
                        <div class="form-group col">
                            <label for="password">Create password</label>
                            <input class="form-control" name="password" id="password" type="password">
                        </div> 
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-block"> Register </button>
                    </div>    
                        
                </form>
            </article>
        </div>
        <p class="text-center mt-4">Have an account? <a href="/login">Log In</a></p>
        <br><br>
    <!-- ============================ COMPONENT REGISTER  END.// ================================= -->
    
    
    </section>

    {% endblock content %}
